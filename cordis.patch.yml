# bundle patch for the taskboard plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile <name> add link:<this repo>`.
#
# The row id lives in the loader's global id space: `ui-taskboard` is spelled
# without the inner hyphen so it cannot collide with the family aggregate row
# `ui-task-board` (@linxin666/dsh-client-ui-task-board), an unrelated plugin.
# The `name` must equal this package name exactly: the official
# dsh-client-modules mounts the browser half on the row whose name equals the
# package name.
- insert:
    - id: ui-taskboard
      name: 'dsh-client-ui-taskboard'
